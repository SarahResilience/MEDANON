name: Deploy MedAnon PWA

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: |
          corepack enable
          yarn install --network-timeout 600000

      - name: Bundle local PDF worker
        run: cp frontend/node_modules/pdfjs-dist/build/pdf.worker.min.mjs frontend/public/pdf.worker.min.mjs

      - name: Build PWA
        working-directory: frontend
        env:
          CI: 'false'
          DISABLE_EMERGENT_OVERLAY: 'true'
          ENABLE_HEALTH_CHECK: 'false'
        run: yarn build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
