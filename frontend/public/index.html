<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1E36" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MedAnon" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.webmanifest" />
    <title>MedAnon Local — Anonymisation médicale locale</title>
    <meta name="description" content="Anonymisez vos documents médicaux localement avant de les utiliser avec une IA. Traitement dans votre navigateur." />
  </head>
  <body>
    <noscript>JavaScript doit être activé pour utiliser MedAnon Local.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator && !window.Capacitor) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('%PUBLIC_URL%/service-worker.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
